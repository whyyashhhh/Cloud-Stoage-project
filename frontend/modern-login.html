<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Login</title>
    <link rel="stylesheet" href="./modern-styles.css">
</head>
<body>
    <!-- Animated background shapes -->
    <div class="background-shapes">
        <div class="shape ribbon-1"></div>
        <div class="shape ribbon-2"></div>
        <div class="shape tube-1"></div>
        <div class="shape tube-2"></div>
    </div>

    <!-- Main container -->
    <div class="container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <h1 class="login-title">Login</h1>
                <p class="login-subtitle">Access your cloud storage</p>
            </div>

            <!-- Login form -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Username</label>
                    <input 
                        class="form-input" 
                        id="email" 
                        type="text" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        class="form-input" 
                        id="password" 
                        type="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- Form footer -->
                <div class="form-footer">
                    <div class="checkbox-group">
                        <input class="checkbox" id="remember" type="checkbox">
                        <label class="checkbox-label" for="remember">Remember me</label>
                    </div>
                    <a class="forgot-link" href="#forgot">Forgot password?</a>
                </div>

                <!-- Sign in button -->
                <button class="btn btn-primary" type="submit" id="signInBtn">
                    Sign in
                </button>
            </form>

            <!-- Divider -->
            <div class="divider-section">
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">Or continue with</span>
                    <div class="divider-line"></div>
                </div>
            </div>

            <!-- Social buttons -->
            <div class="social-buttons">
                <button class="social-btn" title="Sign in with Google" onclick="handleSocialLogin('google')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" fill="white"/>
                    </svg>
                </button>

                <button class="social-btn" title="Sign in with GitHub" onclick="handleSocialLogin('github')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.868-.013-1.703-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.544 2.914 1.186.092-.923.35-1.544.636-1.9-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.137 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                    </svg>
                </button>

                <button class="social-btn" title="Sign in with Facebook" onclick="handleSocialLogin('facebook')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                Don't have an account? <a href="/modern-signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signInBtn');

            if (!username || !password) {
                alert('Please enter username and password');
                return;
            }

            btn.classList.add('loading');
            btn.innerHTML = '<div class="spinner"></div> Signing in...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                localStorage.setItem('token', data.access_token);

                const meResponse = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${data.access_token}`
                    }
                });

                if (meResponse.ok) {
                    const me = await meResponse.json();
                    localStorage.setItem('username', me.username);
                } else {
                    localStorage.setItem('username', username);
                }

                window.location.href = '/modern-dashboard.html';
            } catch (error) {
                alert(error.message || 'Login failed');
            } finally {
                btn.classList.remove('loading');
                btn.textContent = 'Sign in';
            }
        });

        // Social login handlers
        async function handleSocialLogin(provider) {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/oauth/${provider}`);
                const data = await response.json();
                if (response.ok && data.auth_url) {
                    window.location.href = data.auth_url;
                } else {
                    alert(`${provider.toUpperCase()} login is not configured`);
                }
            } catch (error) {
                alert(`Failed to initiate ${provider} login: ${error.message}`);
            }
        }

        // Handle OAuth callbacks
        async function handleOAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const provider = params.get('provider');

            if (code && provider) {
                try {
                    const response = await fetch(`${API_BASE_URL}/auth/callback/${provider}?code=${code}`);
                    const data = await response.json();

                    if (response.ok && data.access_token) {
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('username', data.user.username);
                        window.location.href = '/modern-dashboard.html';
                    } else {
                        alert('OAuth callback failed');
                    }
                } catch (error) {
                    alert(`OAuth callback error: ${error.message}`);
                }
            }
        }

        // Check for OAuth callback on page load
        document.addEventListener('DOMContentLoaded', function() {
            handleOAuthCallback();
        });

        // Input focus effects
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
