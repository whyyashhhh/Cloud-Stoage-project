version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cloud_storage_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-clouduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudpassword}
      POSTGRES_DB: ${DB_NAME:-cloud_storage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clouduser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_network

  redis:
    image: redis:7-alpine
    container_name: cloud_storage_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_storage_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-clouduser}:${DB_PASSWORD:-cloudpassword}@postgres:5432/${DB_NAME:-cloud_storage}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-cloud-storage-dev}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cloud_network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_storage_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-clouduser}:${DB_PASSWORD:-cloudpassword}@postgres:5432/${DB_NAME:-cloud_storage}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-cloud-storage-dev}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "cloud_backend.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    healthcheck:
      disable: true
    networks:
      - cloud_network
    restart: unless-stopped

  # Frontend (Optional - for development)
  frontend:
    image: nginx:alpine
    container_name: cloud_storage_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloud_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cloud_network:
    driver: bridge
