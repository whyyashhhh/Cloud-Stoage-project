services:
  # Backend API Service
  - type: web
    name: cloud-storage-backend
    runtime: python311
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 1 -b 0.0.0.0:8000 -k uvicorn.workers.UvicornWorker cloud_backend.main:app
    envVars:
      - key: DATABASE_URL
        value: ""
      - key: SECRET_KEY
        value: ""
      - key: REDIS_URL
        value: ""
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: S3_BUCKET_NAME
        value: cloud-storage-prod
      - key: MAX_UPLOAD_SIZE_MB
        value: "400"
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: FACEBOOK_CLIENT_ID
        value: ""
      - key: FACEBOOK_CLIENT_SECRET
        value: ""
      - key: GITHUB_CLIENT_ID
        value: ""
      - key: GITHUB_CLIENT_SECRET
        value: ""
      - key: FRONTEND_URL
        value: ""

databases:
  - name: cloud-storage-postgres
    databaseName: cloud_storage
    user: clouduser
    region: oregon
